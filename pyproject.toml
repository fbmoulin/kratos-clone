[project]
name = "10-website-downloader"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "flask>=3.1.2",
    "flask-limiter>=4.0.0",
    "gunicorn>=22.0.0",                 # CVE-2024-1135 (HTTP request smuggling) fixed in 22.0.0
    "openai>=2.50.0",
    "pillow>=12.3.0",
    "playwright>=1.61.0",
    "psutil>=5.9.8",
    "python-dotenv>=1.0",
    "requests>=2.32.5",
    "structlog>=26.1.0",
]

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "mypy>=2.3.0",
    "pip-audit>=2.9",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.1",
    "types-requests>=2.33.0.20260712",
]

[tool.uv]
# CI installs with `uv sync --locked`, which must NOT attempt to build this project.
# The modules are top-level (app.py, downloader.py) and the distribution name
# `10-website-downloader` is not a valid module name, so a build backend cannot infer
# what to ship. Today uv infers non-package status from the ABSENT [build-system]
# table; stating it explicitly means adding [build-system] later cannot silently break
# all seven pinned CI jobs at their install step.
package = false

[tool.pytest.ini_options]
asyncio_mode = "strict"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Default + commonly-useful linters. Keep the set small enough that ruff stays
# fast; expand selectively if specific bug classes show up in review.
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = [
    "E501",  # line length — handled by formatter; long log strings sometimes intentional
    "B008",  # function call in arg defaults — common Flask pattern (limiter.limit(...))
]

[tool.ruff.lint.per-file-ignores]
# Tests can use longer lines and import-pattern shortcuts.
"tests/**/*.py" = ["E501"]
# Legacy single-script generators run side-effecting code at module level.
"scripts/generate_design_system_v2.py" = ["E402"]

[tool.mypy]
python_version = "3.12"
# Start permissive; tighten incrementally per module via the override blocks below.
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
no_implicit_optional = true
# Allow untyped third-party libs without type stubs.
ignore_missing_imports = true
# Stage A+B+C+D typed surface (gated in CI). All source files now under strict
# mypy coverage.
files = [
    "personalize",
    "kratos_clone",
    "app.py",
    "wsgi.py",
    "downloader.py",
    "scripts/inventory.py",
    "scripts/probe.py",
    "scripts/validate.py",
    "scripts/post_process.py",
    "scripts/generate_design_system_v2.py",
]
exclude = ['build/', 'dist/', '\.venv/', 'tests/', 'extracted/', 'extracted_v2/']

# Strict on the new modules where typing was authored deliberately.
[[tool.mypy.overrides]]
module = ["personalize.*"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["app"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["kratos_clone.*"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_unreachable = true

# Stage C — strict on the typed scripts (the four small helpers from C.1
# plus `generate_design_system_v2` folded in at C.2).
[[tool.mypy.overrides]]
module = [
    "scripts.inventory",
    "scripts.probe",
    "scripts.validate",
    "scripts.post_process",
    "scripts.generate_design_system_v2",
]
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_unreachable = true

# Stage D — strict on the legacy `downloader` module (annotation-only pass).
# `wsgi.py` is a 3-line gunicorn entrypoint with no defs to annotate, so it
# inherits the (deliberately permissive) global config without needing a row.
[[tool.mypy.overrides]]
module = ["downloader"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_unreachable = true
