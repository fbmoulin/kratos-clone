# Dependabot config — weekly grouped updates.
# Grouped updates reduce review noise (one PR per ecosystem instead of one
# PR per package). Security updates are a separate group so they can be
# fast-tracked.
#
# Python ecosystem is "uv" (NOT "pip"). uv.lock is the only dependency source of
# truth in this repo, and the Docker image installs from it directly via
# `uv sync --locked`.
#
# 🔴 DO NOT REINTRODUCE requirements.txt. It was deleted 2026-08-03, and the reason is
# the whole point of this note.
#
# It was a file GENERATED from uv.lock, but nothing about it said so: to dependabot it
# looked like a hand-maintained manifest, so it edited single lines in it with no
# awareness of what the lock could satisfy. The same one-line pydantic-core bump
# appeared FOUR times (#43, #48, #53, #73). #43 was merged — a +1/-1 diff invites a
# merge without reading — and it broke the Docker build: pydantic 2.13.4 hard-pins
# pydantic-core==2.46.4, so a requirements.txt carrying 2.47.0 alongside it is
# unsatisfiable and `pip install -r` returned ResolutionImpossible. #48 was the fix.
#
# Retiring the "pip" ecosystem in favour of "uv" did NOT close that class: #73 arrived
# through the uv ecosystem (branch dependabot/uv/production-dependencies-*) and again
# touched requirements.txt alone. Upstream knows: dependabot-core#13912 is open for
# exactly this, and dependabot-core#2883 ("ignore a specific manifest") has been open
# since 2023 — there is no file-level ignore, and `linguist-generated` has no effect.
#
# ⛔ And do NOT add an `ignore:` rule to silence it either. GitHub's options reference
# marks `ignore` as also suppressing SECURITY updates where no `target-branch` is set,
# which is the case here — so ignoring pydantic-core would create a permanent, silent
# CVE blind spot in a Rust-backed validation core. Deleting the file removes the cause
# instead of muting the symptom.
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      production-dependencies:
        dependency-type: "production"
        update-types: ["minor", "patch"]
      development-dependencies:
        dependency-type: "development"
        update-types: ["minor", "patch"]
      security:
        applies-to: "security-updates"
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "chore(ci)"
