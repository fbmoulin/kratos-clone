# Dependabot config — weekly grouped updates.
# Grouped updates reduce review noise (one PR per ecosystem instead of one
# PR per package). Security updates are a separate group so they can be
# fast-tracked.
#
# Python ecosystem is "uv" (NOT "pip"). uv.lock is the source of truth and
# requirements.txt is GENERATED from it (for the Docker/pip deploy). The "pip"
# ecosystem edited requirements.txt line-by-line with no awareness of uv.lock
# or of exact-pin constraints, twice producing an inconsistent pair
# (pydantic 2.13.4 hard-pins pydantic-core==2.46.4, but pip-dependabot bumped
# pydantic-core to 2.47.0 alone) -> `pip install -r requirements.txt`
# ResolutionImpossible -> broken Docker build (see PR #48, #49, #51). The "uv"
# ecosystem updates pyproject.toml + uv.lock via uv's resolver, so it stays
# internally consistent and never touches requirements.txt.
#
# NOTE: dependabot's uv ecosystem updates pyproject.toml AND uv.lock. Whether it
# also rewrites requirements.txt depends on the group: production bumps do (the
# packages appear there), development bumps do not (requirements.txt is exported
# --no-dev, so dev packages have no line to rewrite).
#
# When it does rewrite it, it uses a different resolution scope, so requirements.txt
# ends up AHEAD of uv.lock, and the CI "requirements.txt <-> uv.lock sync" guard fails.
# This is SYSTEMATIC, not occasional: measured on PR #66 (uv.lock advanced 4 packages,
# requirements.txt advanced 16) and reproduced identically after a `@dependabot
# recreate` on PR #70. Expect every production-group PR to arrive with the guard red.
#
# Refresh before merging by naming the TRANSITIVES the guard's diff lists — NOT the
# direct dependencies the PR bumps:
#   scripts/relock.sh <transitive> [<transitive> ...]
#
# Naming a direct dependency overshoots the PR. `uv lock --upgrade-package` resolves
# to the LATEST version the constraint allows, not to the version the PR declares:
# measured on PR #70, naming `openai playwright` moved them to 2.52.0 / 1.62.0, past
# the 2.50.0 / 1.61.0 the PR was reviewed for. See the header of scripts/relock.sh.
#
# Do NOT run `uv export` alone to "fix" it: the export regenerates from the lock and
# therefore DOWNGRADES every transitive dependabot advanced — measured on PR #70,
# 12 packages, including certifi, the CA trust store.
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      production-dependencies:
        dependency-type: "production"
        update-types: ["minor", "patch"]
      development-dependencies:
        dependency-type: "development"
        update-types: ["minor", "patch"]
      security:
        applies-to: "security-updates"
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "chore(ci)"
