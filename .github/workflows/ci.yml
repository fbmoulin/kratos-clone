name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          version: "0.12.1"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked --group dev

      - name: Ruff check
        run: uv run --frozen ruff check kratos_clone/ scripts/ --output-format=github

      - name: Ruff format check
        run: uv run --frozen ruff format --check kratos_clone/ scripts/

  requirements-lock-sync:
    # Guards the deploy path: requirements.txt is the pip/Docker source of truth
    # but is generated from uv.lock, so the two can silently drift (e.g. a
    # dependabot bump editing one but not the other) and break `pip install -r
    # requirements.txt` in the Docker build — invisible to the pytest job, which
    # installs deps ad-hoc and never reads requirements.txt. This re-exports from
    # the lock and diffs (with --locked, so a mismatch fails instead of silently
    # re-locking), ignoring only uv's autogenerated header comment (its `-o <path>`
    # line is environment-dependent; the dependency lines are not). A separate
    # `uv lock --check` step catches the pyproject↔lock drift that neither this diff
    # nor `uv sync` can see.
    name: requirements.txt ⇄ uv.lock sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          version: "0.12.1"
          enable-cache: true

      - name: Assert uv.lock agrees with pyproject.toml
        # `uv sync --frozen` does NOT check this (it exits 0 and installs the stale
        # pin), and the export check below cannot see it either, because it exports
        # from the lock. `uv lock --check` is the only command that detects it.
        run: uv lock --check

      - name: Assert requirements.txt matches uv.lock
        # --locked is required: a bare `uv export` silently re-locks on a mismatch and
        # then exports the FRESH resolution, so the diff below would compare against
        # something that is not the committed lock.
        run: |
          uv export --locked --format requirements-txt --no-dev --no-emit-project --no-hashes -o /tmp/requirements.expected.txt
          if ! diff -u <(grep -v '^#' /tmp/requirements.expected.txt) <(grep -v '^#' requirements.txt); then
            echo "::error::requirements.txt is out of sync with uv.lock. Regenerate with: scripts/relock.sh (see the script header before passing package names)"
            exit 1
          fi
          echo "requirements.txt is in sync with uv.lock"

  smoke:
    name: Import + module smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          version: "0.12.1"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked --group dev

      - name: Verify kratos_clone imports
        run: |
          uv run --frozen python -c "
          from kratos_clone.capture import HardenedCapture, CaptureConfig
          from kratos_clone.post import rewrite_html_assets, strip_scroll_fix
          cfg = CaptureConfig()
          assert cfg.scroll_passes == 3, 'default scroll_passes must be 3'
          assert cfg.use_io_polyfill is True, 'IO polyfill must default on'
          print('kratos_clone OK — config defaults verified')
          "

      - name: Verify CLI entry point parses
        run: uv run --frozen python -m kratos_clone --help

      - name: Smoke test scripts/ imports
        run: |
          uv run --frozen python -c "
          import importlib.util, pathlib
          for f in pathlib.Path('scripts').glob('*.py'):
              spec = importlib.util.spec_from_file_location(f.stem, f)
              # Just compile, do not execute (they expect specific input files)
              with open(f) as fh: compile(fh.read(), str(f), 'exec')
              print(f'{f.name}: compiles')
          "

      - name: Verify post.py round-trip
        run: |
          uv run --frozen python -c "
          from kratos_clone.post import rewrite_html_assets, strip_scroll_fix
          html = '<html><head></head><body><img src=\"https://x.com/a.png\"></body></html>'
          assets = {'https://x.com/a.png': 'assets/a_abc.png'}
          out = rewrite_html_assets(html, assets, 'https://x.com')
          assert 'assets/a_abc.png' in out, 'asset rewrite must replace URL'
          assert 'https://x.com/a.png' not in out, 'original URL must be gone'

          html2 = '<style data-scroll-fix=\"true\">.x{transform:none !important}</style><p>keep</p>'
          out2 = strip_scroll_fix(html2)
          assert 'data-scroll-fix' not in out2
          assert '<p>keep</p>' in out2
          print('post.py: rewrite + strip OK')
          "

      - name: Verify Flask app imports without side effects (factory pattern)
        run: |
          uv run --frozen python -c "
          import threading
          before = threading.active_count()
          import app
          after = threading.active_count()
          assert before == after, f'import must not start threads (before={before}, after={after})'
          routes = {r.rule for r in app.app.url_map.iter_rules()}
          assert '/api/client-errors' in routes, '/api/client-errors must be registered'
          assert '/health' in routes, '/health must remain'
          # Factory roundtrip: returns module-level app
          fresh = app.create_app(start_janitor=False, run_boot_cleanup=False)
          assert fresh is app.app, 'create_app must return module-level app'
          print('app.py: import side-effect-free, factory ok')
          "

  pytest:
    name: pytest (kratos_clone + post + client_errors)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          version: "0.12.1"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked --group dev

      - name: Run pytest
        run: uv run --frozen pytest -v tests/

  render-live:
    # Review #2: tests/test_render_live.py is the regression net for the
    # `.png.tmp` / type="png" render bug, but it is gated on RUN_PLAYWRIGHT_LIVE
    # and the default `pytest` job sets neither that nor a browser binary — so
    # the net never fired in CI and the blind-spot was only nominally closed.
    # This job installs Chromium and runs the gated test so the real render path
    # is exercised on every PR. Kept separate so the Chromium download doesn't
    # slow the main pytest job.
    name: render-live (Playwright PNG regression net)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          version: "0.12.1"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked --group dev

      - name: Install Playwright Chromium
        run: uv run --frozen playwright install --with-deps chromium

      - name: Run live render regression test
        env:
          RUN_PLAYWRIGHT_LIVE: "1"
        run: uv run --frozen pytest -v tests/test_render_live.py

  pip-audit:
    name: pip-audit (CVE scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          version: "0.12.1"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked --group dev

      - name: Audit installed packages
        # Strict mode reserved for Phase 7; soft gate now. Re-emits findings
        # so they're visible in CI logs even when not failing the build.
        run: uv run --frozen pip-audit --vulnerability-service osv --desc on || true

  mypy:
    name: mypy (Stage A+B+C+D — full strict on personalize/ + app.py + wsgi.py + kratos_clone/* + scripts/* + downloader.py)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          version: "0.12.1"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked --group dev

      - name: Run mypy
        # HARD gate. All source files now under strict typing coverage:
        # personalize/, app.py, wsgi.py, kratos_clone/*,
        # scripts/{inventory,probe,validate,post_process,generate_design_system_v2},
        # and downloader.py. Stage D (downloader.py) closed the last permissive
        # override; the rollout (Stages A–D) is now complete.
        run: uv run --frozen mypy --config-file pyproject.toml

  bandit:
    name: bandit (security lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          version: "0.12.1"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked --group dev

      - name: Run bandit (MEDIUM gate, LOW informational)
        # HARD gate on MEDIUM severity. LOW findings (e.g., 2× B110
        # try/except/pass) remain informational. Existing HIGH/MEDIUM
        # findings (debug=True in __main__, MD5 for asset filenames) are
        # annotated #nosec B201 / usedforsecurity=False.
        run: uv run --frozen bandit -r personalize/ kratos_clone/ scripts/ app.py --severity-level medium

  forward-compat:
    # Informational only. Pinning every other job to uv.lock means nothing in CI
    # exercises newer dependency releases, so a forward-incompatibility (e.g. the
    # beautifulsoup4 4.15 find_all overload change) would stay invisible until a
    # lock bump made it red on an unrelated PR. This job deliberately resolves
    # latest-from-PyPI so that incompatibility appears as a yellow annotation on the
    # PR that introduces it. It must never gate: continue-on-error is load-bearing.
    name: forward-compat canary (unpinned — informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          version: "0.12.1"

      - name: Type-check against latest dependencies
        run: |
          uv run --isolated --no-project \
            --with mypy --with beautifulsoup4 --with openai --with pillow \
            --with python-dotenv --with playwright --with requests --with types-requests \
            --with urllib3 --with flask --with flask-limiter --with gunicorn \
            --with psutil --with structlog \
            mypy --config-file pyproject.toml
