name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    # Detect whether this push/PR touches non-doc files. The two expensive jobs
    # (render-live, docker-build; ~100s combined) skip when everything changed
    # ends in `.md` — those are the seconds doc-only PRs #85/#86/#87/#88
    # wasted. Cheap required-status-checks (Lint (ruff), Import + module smoke
    # test) still run unconditionally so branch-protection never trips over
    # the paths-ignore trap: a required check that is "skipped rather than
    # green" blocks the merge, and that is the failure mode workflow-level
    # `paths-ignore:` would silently introduce here.
    name: detect code changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # base + head needed to compute the diff on PRs
      - id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_SHA: ${{ github.sha }}
        run: |
          # workflow_dispatch has no diff to compute — always run everything.
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="$PR_BASE"; head="$PR_HEAD"
          else
            base="$PUSH_BEFORE"; head="$PUSH_SHA"
          fi
          # New-branch push carries a zero-sha `before` — no ancestor to diff
          # against, so bail to code=true and let CI cover the branch fully.
          if [ "$base" = "0000000000000000000000000000000000000000" ] || [ -z "$base" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # Any file whose path (case-insensitive) doesn't end in `.md` counts as
          # code. The set stays deliberately narrow — one extension, no path
          # prefix — so a rename like docs/something.py (weird but possible)
          # still trips the code=true branch instead of getting silently
          # skipped alongside its neighbouring `.md` siblings.
          if git diff --name-only "$base" "$head" | grep -qivE '\.md$'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          version: "0.12.1"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked --group dev

      - name: Ruff check
        run: uv run --frozen ruff check kratos_clone/ scripts/ --output-format=github

      - name: Ruff format check
        run: uv run --frozen ruff format --check kratos_clone/ scripts/

  lock-sync:
    # What is left of the old "requirements.txt ⇄ uv.lock sync" job. The export/diff
    # half is gone with requirements.txt itself: the container now installs straight
    # from uv.lock (`uv sync --locked`), so there is no second, derived file that can
    # drift from the lock.
    #
    # This half stays, and it is not redundant with anything: pyproject.toml and
    # uv.lock CAN still disagree, and `uv lock --check` is the only command that
    # detects it. `uv sync --frozen` does not — it exits 0 and installs the stale pin.
    # `uv sync --locked` does fail on it, but only in the jobs that run a sync; this
    # job states the invariant on its own.
    name: uv.lock ⇄ pyproject.toml sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          version: "0.12.1"
          enable-cache: true

      - name: Assert uv.lock agrees with pyproject.toml
        run: uv lock --check

  smoke:
    name: Import + module smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          version: "0.12.1"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked --group dev

      - name: Verify kratos_clone imports
        run: |
          uv run --frozen python -c "
          from kratos_clone.capture import HardenedCapture, CaptureConfig
          from kratos_clone.post import rewrite_html_assets, strip_scroll_fix
          cfg = CaptureConfig()
          assert cfg.scroll_passes == 3, 'default scroll_passes must be 3'
          assert cfg.use_io_polyfill is True, 'IO polyfill must default on'
          print('kratos_clone OK — config defaults verified')
          "

      - name: Verify CLI entry point parses
        run: uv run --frozen python -m kratos_clone --help

      - name: Smoke test scripts/ imports
        run: |
          uv run --frozen python -c "
          import importlib.util, pathlib
          for f in pathlib.Path('scripts').glob('*.py'):
              spec = importlib.util.spec_from_file_location(f.stem, f)
              # Just compile, do not execute (they expect specific input files)
              with open(f) as fh: compile(fh.read(), str(f), 'exec')
              print(f'{f.name}: compiles')
          "

      - name: Verify post.py round-trip
        run: |
          uv run --frozen python -c "
          from kratos_clone.post import rewrite_html_assets, strip_scroll_fix
          html = '<html><head></head><body><img src=\"https://x.com/a.png\"></body></html>'
          assets = {'https://x.com/a.png': 'assets/a_abc.png'}
          out = rewrite_html_assets(html, assets, 'https://x.com')
          assert 'assets/a_abc.png' in out, 'asset rewrite must replace URL'
          assert 'https://x.com/a.png' not in out, 'original URL must be gone'

          html2 = '<style data-scroll-fix=\"true\">.x{transform:none !important}</style><p>keep</p>'
          out2 = strip_scroll_fix(html2)
          assert 'data-scroll-fix' not in out2
          assert '<p>keep</p>' in out2
          print('post.py: rewrite + strip OK')
          "

      - name: Verify Flask app imports without side effects (factory pattern)
        run: |
          uv run --frozen python -c "
          import threading
          before = threading.active_count()
          import app
          after = threading.active_count()
          assert before == after, f'import must not start threads (before={before}, after={after})'
          routes = {r.rule for r in app.app.url_map.iter_rules()}
          assert '/api/client-errors' in routes, '/api/client-errors must be registered'
          assert '/health' in routes, '/health must remain'
          # Factory roundtrip: returns module-level app
          fresh = app.create_app(start_janitor=False, run_boot_cleanup=False)
          assert fresh is app.app, 'create_app must return module-level app'
          print('app.py: import side-effect-free, factory ok')
          "

  pytest:
    name: pytest (kratos_clone + post + client_errors)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          version: "0.12.1"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked --group dev

      - name: Run pytest
        run: uv run --frozen pytest -v tests/

  render-live:
    # Doc-only pushes/PRs (nothing but `.md` in the diff) skip this via the
    # `changes` job — Chromium download + live render is ~40s that a text
    # change cannot break.
    needs: changes
    if: needs.changes.outputs.code == 'true'
    # Review #2: tests/test_render_live.py is the regression net for the
    # `.png.tmp` / type="png" render bug, but it is gated on RUN_PLAYWRIGHT_LIVE
    # and the default `pytest` job sets neither that nor a browser binary — so
    # the net never fired in CI and the blind-spot was only nominally closed.
    # This job installs Chromium and runs the gated test so the real render path
    # is exercised on every PR. Kept separate so the Chromium download doesn't
    # slow the main pytest job.
    name: render-live (Playwright PNG regression net)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          version: "0.12.1"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked --group dev

      - name: Install Playwright Chromium
        run: uv run --frozen playwright install --with-deps chromium

      - name: Run live render regression test
        env:
          RUN_PLAYWRIGHT_LIVE: "1"
        run: uv run --frozen pytest -v tests/test_render_live.py

  pip-audit:
    name: pip-audit (CVE scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          version: "0.12.1"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked --group dev

      - name: Audit installed packages
        # Strict mode reserved for Phase 7; soft gate now. Re-emits findings
        # so they're visible in CI logs even when not failing the build.
        run: uv run --frozen pip-audit --vulnerability-service osv --desc on || true

  mypy:
    name: mypy (Stage A+B+C+D — full strict on personalize/ + app.py + wsgi.py + kratos_clone/* + scripts/* + downloader.py)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          version: "0.12.1"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked --group dev

      - name: Run mypy
        # HARD gate. All source files now under strict typing coverage:
        # personalize/, app.py, wsgi.py, kratos_clone/*,
        # scripts/{inventory,probe,validate,post_process,generate_design_system_v2},
        # and downloader.py. Stage D (downloader.py) closed the last permissive
        # override; the rollout (Stages A–D) is now complete.
        run: uv run --frozen mypy --config-file pyproject.toml

  bandit:
    name: bandit (security lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          version: "0.12.1"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked --group dev

      - name: Run bandit (MEDIUM gate, LOW informational)
        # HARD gate on MEDIUM severity. LOW findings (e.g., 2× B110
        # try/except/pass) remain informational. Existing HIGH/MEDIUM
        # findings (debug=True in __main__, MD5 for asset filenames) are
        # annotated #nosec B201 / usedforsecurity=False.
        run: uv run --frozen bandit -r personalize/ kratos_clone/ scripts/ app.py --severity-level medium

  forward-compat:
    # Informational only. Pinning every other job to uv.lock means nothing in CI
    # exercises newer dependency releases, so a forward-incompatibility (e.g. the
    # beautifulsoup4 4.15 find_all overload change) would stay invisible until a
    # lock bump made it red on an unrelated PR. This job deliberately resolves
    # latest-from-PyPI so that incompatibility appears as a yellow annotation on the
    # PR that introduces it. It must never gate: continue-on-error is load-bearing.
    name: forward-compat canary (unpinned — informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          version: "0.12.1"

      - name: Type-check against latest dependencies
        run: |
          uv run --isolated --no-project \
            --with mypy --with beautifulsoup4 --with openai --with pillow \
            --with python-dotenv --with playwright --with requests --with types-requests \
            --with urllib3 --with flask --with flask-limiter --with gunicorn \
            --with psutil --with structlog \
            mypy --config-file pyproject.toml

  docker-build:
    # Doc-only pushes/PRs (nothing but `.md` in the diff) skip this via the
    # `changes` job — the image build takes ~65s and touches nothing that a
    # text change could break. Keep unconditional the moment anything in the
    # build surface (Dockerfile, entrypoint.sh, pyproject.toml, uv.lock,
    # anything .py) is in the diff.
    needs: changes
    if: needs.changes.outputs.code == 'true'
    # Nothing else in this pipeline builds the container. Every other job installs
    # dependencies its own way (uv sync into a runner venv), so the Dockerfile — the
    # thing production actually runs — was verified by nobody. That gap is not
    # hypothetical: PR #43 merged a one-line requirements.txt edit that made
    # `pip install -r` unresolvable, and the break surfaced at deploy time.
    #
    # This job builds the real image and proves three things a green pytest cannot:
    # the build succeeds, the app imports inside the image, and gunicorn resolves on
    # PATH for the bare invocation entrypoint.sh uses.
    #
    # Deliberately NOT a required status check yet: it is the slowest job here
    # (Chromium download) and should prove itself stable before it can block a merge.
    name: docker image build + smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build the production image
        # GIT_SHA is what /health reports as build_sha. Passing it here also proves the
        # ARG is wired, which no other job checks.
        run: docker build --build-arg GIT_SHA="${{ github.sha }}" -t kratos-clone:ci .

      - name: App imports inside the image
        run: docker run --rm kratos-clone:ci python -c "import app; print('import ok')"

      - name: gunicorn resolves on PATH
        # entrypoint.sh calls bare `gunicorn`. That move has now HAPPENED: the image
        # installs into /app/.venv via `uv sync`, so gunicorn only resolves because the
        # Dockerfile sets ENV PATH="/app/.venv/bin:$PATH". Without that line the image
        # still builds green and the container dies on start. This is the step that
        # catches it, and it is the reason this job shipped one PR ahead of that change.
        run: docker run --rm kratos-clone:ci sh -c 'command -v gunicorn && gunicorn --version'

      - name: Container serves /health with the build SHA it was built from
        # Note on what `github.sha` is here: on a pull_request event it is the EPHEMERAL
        # MERGE COMMIT (head merged into base), not the PR head — so the build_sha this
        # step prints will not exist in permanent history. That is expected, and the
        # assertion is still sound because both sides read the same value. On a push to
        # main, `github.sha` is the real commit and the reported build_sha is meaningful.
        run: |
          docker run --rm -d -p 8099:8080 --name kc-ci kratos-clone:ci
          for i in $(seq 1 30); do
            if curl -sf localhost:8099/health > /tmp/health.json; then break; fi
            sleep 2
          done
          docker logs kc-ci
          docker rm -f kc-ci
          cat /tmp/health.json
          python3 -c "
          import json, sys
          h = json.load(open('/tmp/health.json'))
          print('health:', h)
          assert h.get('status') == 'ok', h
          got, want = h.get('build_sha'), '${{ github.sha }}'
          assert got == want, f'build_sha mismatch: image reports {got!r}, expected {want!r}'
          print('build_sha matches the commit the image was built from')
          "
